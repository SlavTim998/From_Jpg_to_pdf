<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#071525"/>
      <stop offset="1" stop-color="#123d78"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#55d7ff"/>
      <stop offset="1" stop-color="#2580ff"/>
    </linearGradient>
    <linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ff9c63"/>
      <stop offset="0.45" stop-color="#f8c36f"/>
      <stop offset="0.46" stop-color="#5da7ca"/>
      <stop offset="1" stop-color="#174f73"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1600" height="700" rx="38" fill="url(#bg)"/>
  <circle cx="1420" cy="90" r="260" fill="#1d75d5" opacity=".18"/>
  <circle cx="1220" cy="640" r="330" fill="#2563eb" opacity=".12"/>

  <!-- Photos + PDF illustration -->
  <g transform="translate(82 108)" filter="url(#shadow)">
    <!-- back photo -->
    <g transform="translate(8 36) rotate(-10 160 160)">
      <rect x="0" y="45" width="286" height="244" rx="24" fill="#fff"/>
      <rect x="22" y="67" width="242" height="200" rx="14" fill="#244d66"/>
      <path d="M22 223l58-61 45 38 49-61 90 84v44H22z" fill="#2e6d79"/>
      <circle cx="213" cy="105" r="17" fill="#f0cf73"/>
    </g>

    <!-- NEW front photo: coastal sunset -->
    <g transform="translate(40 76) rotate(-4 160 145)">
      <rect x="0" y="0" width="300" height="252" rx="24" fill="#fff"/>
      <rect x="22" y="22" width="256" height="208" rx="14" fill="url(#sunset)"/>
      <circle cx="207" cy="92" r="25" fill="#ffe19a" opacity=".95"/>
      <path d="M22 159c41 7 77 2 111-14 36-17 79-17 145 3v82H22z" fill="#235b75" opacity=".8"/>
      <path d="M22 190c47-5 86 2 117 22 30-23 69-34 139-27v45H22z" fill="#18445d"/>
      <ellipse cx="76" cy="190" rx="38" ry="17" fill="#24363f"/>
      <ellipse cx="171" cy="205" rx="47" ry="20" fill="#28383d"/>
      <ellipse cx="237" cy="174" rx="30" ry="13" fill="#33464d"/>
      <path d="M183 116h48" stroke="#fff1c3" stroke-width="5" stroke-linecap="round" opacity=".85"/>
    </g>

    <!-- PDF sheet -->
    <g transform="translate(250 8)">
      <path d="M0 0h250l95 95v330H0z" fill="#f8fafc"/>
      <path d="M250 0v95h95" fill="#dfe7f2"/>
      <path d="M88 177c25-60 70-57 93 0 21 56 57 75 97 89-68 3-118-15-150-55-30 36-57 58-91 68 23-27 40-59 51-102z" fill="#e1252e"/>
      <rect x="63" y="303" width="220" height="72" rx="18" fill="#e1252e"/>
      <text x="173" y="351" text-anchor="middle" font-family="Segoe UI,Arial" font-size="48" font-weight="800" fill="#fff">PDF</text>
    </g>

    <!-- Arrow -->
    <path d="M285 68c62-66 129-71 187-27" fill="none" stroke="url(#blue)" stroke-width="28" stroke-linecap="round"/>
    <path d="M454 18l58 41-67 18z" fill="#4ac9ff"/>
  </g>

  <!-- Safe text area -->
  <g font-family="Segoe UI,Arial" fill="#fff">
    <text x="610" y="175" font-size="70" font-weight="800">Photo PDF <tspan fill="#43b9ff">Studio</tspan></text>
    <text x="612" y="228" font-size="27" fill="#c9d7e8">Фотографии → один PDF. Быстро, локально и удобно.</text>

    <g font-size="23">
      <text x="612" y="325">✓ Drag &amp; Drop сортировка</text>
      <text x="612" y="374">✓ Миниатюры и предпросмотр</text>
      <text x="612" y="423">✓ JPG / PNG / WebP / TIFF</text>

      <text x="1010" y="325">✓ Экспорт в один PDF</text>
      <text x="1010" y="374">✓ Desktop-интерфейс</text>
      <text x="1010" y="423">✓ Windows EXE</text>
    </g>

    <rect x="610" y="490" width="340" height="68" rx="18" fill="#2388ff"/>
    <text x="780" y="534" text-anchor="middle" font-size="26" font-weight="700">Open Source • Python</text>

    <text x="612" y="610" font-size="20" fill="#8fb5df">GitHub: SlavTim998/From_Jpg_to_pdf</text>
  </g>
</svg>
